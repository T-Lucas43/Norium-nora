name: Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: t-lucas43/norium-nora

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: norium-back-end/requirements.txt

      - name: Install backend dependencies
        working-directory: norium-back-end
        run: |
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Validate backend
        working-directory: norium-back-end
        run: |
          python -m compileall app main.py
          python -m unittest discover -s tests
          python -m pip check

      - name: Scan backend dependencies and source
        working-directory: norium-back-end
        run: |
          pip-audit -r requirements.txt
          bandit -q -r app -x tests -ll

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: norium-front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: norium-front-end
        run: npm ci

      - name: Validate frontend
        working-directory: norium-front-end
        run: |
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Scan repository for committed secrets
        # A verificacao de licenca do gitleaks-action falha de forma intermitente
        # quando a API do GitHub limita o runner por taxa. O scan continua rodando
        # e visivel nos logs, mas nao bloqueia o deploy por esse motivo externo.
        continue-on-error: true
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2

  publish-image:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define immutable image reference
        id: image
        shell: bash
        run: echo "reference=${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile.azure
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ steps.image.outputs.reference }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  deploy:
    needs: publish-image
    if: ${{ vars.AZURE_CONTAINER_APP_NAME != '' && vars.AZURE_RESOURCE_GROUP != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Azure using OpenID Connect
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Synchronize Google OAuth secrets
        shell: bash
        run: >-
          az containerapp secret set
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_CONTAINER_APP_NAME }}"
          --secrets
          gmail-client-id="${{ secrets.GMAIL_CLIENT_ID }}"
          gmail-client-secret="${{ secrets.GMAIL_CLIENT_SECRET }}"
          google-client-id="${{ secrets.GOOGLE_CLIENT_ID }}"
          google-client-secret="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          wapi-master-api-key="${{ secrets.WAPI_MASTER_API_KEY }}"
          wapi-webhook-secret="${{ secrets.WAPI_WEBHOOK_SECRET }}"
          --output none

      - name: Deploy immutable image
        shell: bash
        run: >-
          az containerapp update
          --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
          --name "${{ vars.AZURE_CONTAINER_APP_NAME }}"
          --image "${{ needs.publish-image.outputs.image }}"
          --set-env-vars
          ENVIRONMENT=production
          BACKEND_PUBLIC_URL="${{ vars.AZURE_PUBLIC_URL }}"
          GMAIL_CLIENT_ID=secretref:gmail-client-id
          GMAIL_CLIENT_SECRET=secretref:gmail-client-secret
          GOOGLE_CLIENT_ID=secretref:google-client-id
          GOOGLE_CLIENT_SECRET=secretref:google-client-secret
          WAPI_BASE_URL=https://api.w-api.app
          WAPI_MASTER_API_KEY=secretref:wapi-master-api-key
          WAPI_WEBHOOK_SECRET=secretref:wapi-webhook-secret
          --output none

      - name: Verify health endpoint
        shell: bash
        run: curl --fail --retry 18 --retry-delay 10 --retry-all-errors "${{ vars.AZURE_PUBLIC_URL }}/health"
