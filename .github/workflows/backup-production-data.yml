name: Encrypted production backup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: norium-production-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install backup dependencies
        run: python -m pip install azure-storage-file-share==12.23.1 cryptography==46.0.5
      - name: Snapshot and verify encrypted backup
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          NORIUM_BACKUP_KEY: ${{ secrets.NORIUM_PRODUCTION_BACKUP_KEY }}
        run: python infra/azure/backup_production_data.py
      - name: Preserve encrypted package and aggregate verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-backup-${{ github.run_id }}
          path: |
            output/production-backup/production-data.enc
            output/production-backup/report.json
          if-no-files-found: error
          retention-days: 3
