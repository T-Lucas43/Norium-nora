name: Deploy WhatsApp API

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: whatsapp-api-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOYMENT_APP: norium-whatsapp-app
      WHATSAPP_APP_NAME: norium-whatsapp-api
      REGISTRY: ghcr.io
      IMAGE_NAME: noriumnoraai-ui/norium-nora
    steps:
      - name: Checkout WhatsApp API repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: T-Lucas43/norium-whatsapp-api
          ref: main
          path: whatsapp-api
          ssh-key: ${{ secrets.WHATSAPP_REPO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Authenticate with Azure using OpenID Connect
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate protected configuration
        shell: bash
        env:
          NORIUM_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.WHATSAPP_ADMIN_API_KEY }}
          HMAC_SECRET: ${{ secrets.WHATSAPP_WEBHOOK_HMAC_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WHATSAPP_WEBHOOK_SECRET }}
          OWNER_USER_ID: ${{ vars.WHATSAPP_OWNER_USER_ID }}
        run: |
          set -euo pipefail
          for value in "$NORIUM_API_KEY" "$ADMIN_API_KEY" "$HMAC_SECRET" "$WEBHOOK_SECRET"; do
            test "${#value}" -ge 32
          done
          test -n "$OWNER_USER_ID"

      - name: Resolve the production owner from persistent storage
        id: owner
        shell: bash
        run: |
          set -euo pipefail
          fallback="${{ vars.WHATSAPP_OWNER_USER_ID }}"
          storage_account="$(az storage account list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "[?tags.application=='norium'].name | [0]" \
            --output tsv)"
          owner_id="$fallback"
          if [ -n "$storage_account" ]; then
            storage_key="$(az storage account keys list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --account-name "$storage_account" \
              --query '[0].value' \
              --output tsv)"
            echo "::add-mask::$storage_key"
            if az storage file download \
              --account-name "$storage_account" \
              --account-key "$storage_key" \
              --share-name norium-data \
              --path usuarios_db.json \
              --dest "${RUNNER_TEMP}/norium-users.json" \
              --output none; then
              persisted_owner="$(python3 -c 'import json,sys; users=json.load(open(sys.argv[1], encoding="utf-8")).get("users", []); active=[u for u in users if isinstance(u, dict) and u.get("status") != "inativo"]; choices=[u for u in active if u.get("systemAdmin")] or [u for u in active if str(u.get("email", "")).lower()=="tarcisiolucas43@gmail.com"] or [u for u in active if u.get("role")=="owner"]; print(str(choices[0].get("id", "")) if choices else "")' "${RUNNER_TEMP}/norium-users.json")"
              if [ -n "$persisted_owner" ]; then owner_id="$persisted_owner"; fi
            fi
          fi
          test -n "$owner_id"
          echo "user_id=$owner_id" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C whatsapp-api rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "reference=${REGISTRY}/${IMAGE_NAME}:whatsapp-sha-${source_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable WhatsApp image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: whatsapp-api
          file: whatsapp-api/Dockerfile
          push: true
          tags: ${{ steps.source.outputs.reference }}
          cache-from: type=gha,scope=whatsapp-api
          cache-to: type=gha,mode=max,scope=whatsapp-api
          provenance: mode=max
          sbom: true

      - name: Provision API and persistent session storage
        id: app
        shell: bash
        env:
          NORIUM_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          ADMIN_API_KEY: ${{ secrets.WHATSAPP_ADMIN_API_KEY }}
          HMAC_SECRET: ${{ secrets.WHATSAPP_WEBHOOK_HMAC_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WHATSAPP_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          registry_password="$(az containerapp secret list \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --show-values \
            --query "[?name=='ghcr-token'].value | [0]" \
            --output tsv)"
          test -n "$registry_password"
          echo "::add-mask::$registry_password"
          managed_environment_id="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query properties.managedEnvironmentId \
            --output tsv)"
          app_location="$(az containerapp show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --query location \
            --output tsv)"
          test -n "$managed_environment_id"
          test -n "$app_location"
          az deployment group create \
            --name "$DEPLOYMENT_APP" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file whatsapp-api/infra/main.bicep \
            --parameters \
              appName="$WHATSAPP_APP_NAME" \
              location="$app_location" \
              managedEnvironmentId="$managed_environment_id" \
              containerImage="${{ steps.source.outputs.reference }}" \
              registryPassword="$registry_password" \
              noriumWebhookUrl="${{ vars.AZURE_PUBLIC_URL }}/api/whatsapp/webhook" \
              allowedOrigin="${{ vars.AZURE_PUBLIC_URL }}" \
              noriumApiKey="$NORIUM_API_KEY" \
              adminApiKey="$ADMIN_API_KEY" \
              webhookHmacSecret="$HMAC_SECRET" \
              noriumWebhookSecret="$WEBHOOK_SECRET" \
            --output none
          public_url="$(az deployment group show \
            --name "$DEPLOYMENT_APP" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query properties.outputs.publicUrl.value \
            --output tsv)"
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"

      - name: Connect Norium to the private API
        shell: bash
        env:
          NORIUM_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          HMAC_SECRET: ${{ secrets.WHATSAPP_WEBHOOK_HMAC_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.WHATSAPP_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          az containerapp secret set \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --secrets \
              whatsapp-api-key="$NORIUM_API_KEY" \
              whatsapp-webhook-hmac-secret="$HMAC_SECRET" \
              whatsapp-webhook-secret="$WEBHOOK_SECRET" \
            --output none
          az containerapp update \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --set-env-vars \
              WHATSAPP_API_URL="${{ steps.app.outputs.public_url }}/v1" \
              WHATSAPP_API_KEY=secretref:whatsapp-api-key \
              WHATSAPP_WEBHOOK_HMAC_SECRET=secretref:whatsapp-webhook-hmac-secret \
              WHATSAPP_WEBHOOK_SECRET=secretref:whatsapp-webhook-secret \
              WHATSAPP_LEGACY_OWNER_USER_ID="${{ steps.owner.outputs.user_id }}" \
            --remove-env-vars \
              WHATSAPP_OWNER_USER_ID \
              WHATSAPP_INSTANCE_ID \
              WHATSAPP_INSTANCE_TOKEN \
              WHATSAPP_CLIENT_TOKEN \
              ZAPI_INSTANCE_ID \
              ZAPI_TOKEN \
              TELEGRAM_BOT_TOKEN \
              TELEGRAM_WEBHOOK_SECRET \
              TELEGRAM_OWNER_EMAIL \
              TELEGRAM_OWNER_USER_ID \
              TELEGRAM_ALLOWED_USER_IDS \
              TELEGRAM_ALLOWED_CHAT_IDS \
            --output none

      - name: Verify both production services
        shell: bash
        env:
          NORIUM_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          OWNER_USER_ID: ${{ steps.owner.outputs.user_id }}
        run: |
          set -euo pipefail
          verify_endpoint() {
            local url="$1"
            local attempts="$2"
            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if curl --silent --show-error --fail --connect-timeout 8 --max-time 20 "$url"; then
                return 0
              fi
              sleep 10
            done
            return 1
          }

          if ! verify_endpoint "${{ steps.app.outputs.public_url }}/health" 18; then
            az containerapp revision list \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$WHATSAPP_APP_NAME" \
              --query "[].{name:name,active:properties.active,health:properties.healthState,provisioning:properties.provisioningState,replicas:properties.replicas}" \
              --output table || true
            az containerapp logs show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$WHATSAPP_APP_NAME" \
              --type system \
              --tail 80 || true
            exit 1
          fi
          verify_endpoint "${{ vars.AZURE_PUBLIC_URL }}/health" 18

          session_id="norium"
          session_signature="$(python3 -c 'import hashlib,hmac,os; key=os.environ["NORIUM_API_KEY"].encode(); payload=(os.environ["OWNER_USER_ID"]+"\nnorium").encode(); print(hmac.new(key,payload,hashlib.sha256).hexdigest())')"
          echo "::add-mask::$session_signature"

          curl --silent --show-error --fail \
            --connect-timeout 8 --max-time 30 \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer $NORIUM_API_KEY" \
            --header "X-Norium-User-Id: $OWNER_USER_ID" \
            --header "X-Norium-Session-Id: $session_id" \
            --header "X-Norium-Session-Signature: $session_signature" \
            --data '{}' \
            "${{ steps.app.outputs.public_url }}/v1/session/reconnect" > /dev/null

          session_state=""
          for attempt in {1..42}; do
            session_payload="$(curl --silent --show-error --fail \
              --connect-timeout 8 --max-time 30 \
              --header "Authorization: Bearer $NORIUM_API_KEY" \
              --header "X-Norium-User-Id: $OWNER_USER_ID" \
              --header "X-Norium-Session-Id: $session_id" \
              --header "X-Norium-Session-Signature: $session_signature" \
              "${{ steps.app.outputs.public_url }}/v1/session/status")"
            session_state="$(printf '%s' "$session_payload" | python3 -c 'import json,sys; payload=json.load(sys.stdin); print(payload.get("state", ""))')"
            session_detail="$(printf '%s' "$session_payload" | python3 -c 'import json,sys; payload=json.load(sys.stdin); print(payload.get("lastError") or "")')"
            echo "WhatsApp session state: $session_state${session_detail:+ - $session_detail}"
            if [ "$session_state" = "connected" ]; then break; fi
            sleep 10
          done
          if [ "$session_state" != "connected" ]; then
            az containerapp logs show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "$WHATSAPP_APP_NAME" \
              --type console \
              --tail 120 || true
            exit 1
          fi

          catalog_file="${RUNNER_TEMP}/whatsapp-catalog.json"
          curl --silent --show-error --fail \
            --connect-timeout 8 --max-time 60 \
            --header "Authorization: Bearer $NORIUM_API_KEY" \
            --header "X-Norium-User-Id: $OWNER_USER_ID" \
            --header "X-Norium-Session-Id: $session_id" \
            --header "X-Norium-Session-Signature: $session_signature" \
            "${{ steps.app.outputs.public_url }}/v1/chats" \
            --output "$catalog_file"
          chat_count="$(python3 -c 'import json,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(payload, list); print(len(payload))' "$catalog_file")"
          test "$chat_count" -gt 0
          echo "Authenticated WhatsApp catalog returned $chat_count chat(s)."

          mapfile -t media_target < <(python3 -c 'import json,sys; chats=json.load(open(sys.argv[1], encoding="utf-8")); match=next(((str(message.get("id") or ""), str(chat.get("id") or "")) for chat in chats if isinstance(chat, dict) for message in reversed(chat.get("messages") or []) if isinstance(message, dict) and message.get("mediaAvailable") and str(message.get("type") or "").lower() in {"image","video","audio","ptt","document","sticker"} and message.get("id") and chat.get("id")), None); print("\n".join(match or ()))' "$catalog_file")
          test "${#media_target[@]}" -ge 2
          media_path_id="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "${media_target[0]}")"
          media_file="${RUNNER_TEMP}/whatsapp-media.json"
          curl --silent --show-error --fail \
            --connect-timeout 8 --max-time 90 \
            --get \
            --data-urlencode "chatId=${media_target[1]}" \
            --header "Authorization: Bearer $NORIUM_API_KEY" \
            --header "X-Norium-User-Id: $OWNER_USER_ID" \
            --header "X-Norium-Session-Id: $session_id" \
            --header "X-Norium-Session-Signature: $session_signature" \
            "${{ steps.app.outputs.public_url }}/v1/messages/${media_path_id}/media" \
            --output "$media_file"
          python3 -c 'import base64,json,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); data=payload.get("data", ""); assert data.startswith("data:") and ";base64," in data; decoded=base64.b64decode(data.split(",", 1)[1], validate=True); assert len(decoded) > 0' "$media_file"
          echo "Authenticated WhatsApp media retrieval succeeded."
