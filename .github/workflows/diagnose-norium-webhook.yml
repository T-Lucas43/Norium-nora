name: Diagnose Norium Webhook

# Diagnóstico temporário: puxa os logs REDIGIDOS de webhook do app Norium
# (linhas "WAPI_WEBHOOK_DEBUG", sem texto de mensagem e com telefones mascarados)
# para mapear os campos reais da W-API de status/visto e mensagens fromMe.
# Requer WHATSAPP_WEBHOOK_DEBUG=true no deploy. Dispare manualmente (Actions -> Run).

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate with Azure using OpenID Connect
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read redacted webhook debug logs
        shell: bash
        run: |
          set -euo pipefail
          echo "== Linhas WAPI_WEBHOOK_DEBUG (últimas 200) =="
          az containerapp logs show \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_CONTAINER_APP_NAME }}" \
            --type console \
            --follow false \
            --tail 300 \
            --format text \
            | grep -Eai 'WAPI_WEBHOOK_DEBUG' \
            | tail -n 200 \
            || echo "(nenhuma linha WAPI_WEBHOOK_DEBUG encontrada — confirme WHATSAPP_WEBHOOK_DEBUG=true e que houve tráfego de webhook)"
