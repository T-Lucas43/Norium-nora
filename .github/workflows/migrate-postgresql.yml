name: Migrate production to PostgreSQL
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Digite MIGRAR_PARA_POSTGRESQL'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: azure-container-apps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      AZURE_PUBLIC_URL: ${{ vars.AZURE_PUBLIC_URL }}
      POSTGRES_DATABASE: norium
      POSTGRES_ADMIN_LOGIN: noriumbootstrap
      POSTGRES_APP_LOGIN: norium_app
      MIGRATION_SOURCE: /tmp/norium-postgres-source
    steps:
      - name: Require exact cutover confirmation
        env:
          REQUESTED_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: test "$REQUESTED_CONFIRMATION" = 'MIGRAR_PARA_POSTGRESQL'

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: norium-back-end/requirements.lock.txt

      - name: Verify the requested immutable image is already active
        shell: bash
        run: |
          expected="ghcr.io/t-lucas43/norium-nora:sha-${GITHUB_SHA}"
          active="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query properties.template.containers[0].image -o tsv)"
          test "$active" = "$expected"

      - name: Generate one-time bootstrap and application credentials
        shell: bash
        run: |
          admin_password="$(openssl rand -base64 48 | tr -d '\n')"
          app_password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$admin_password"
          echo "::add-mask::$app_password"
          echo "POSTGRES_ADMIN_PASSWORD=$admin_password" >> "$GITHUB_ENV"
          echo "POSTGRES_APP_PASSWORD=$app_password" >> "$GITHUB_ENV"
          resource_id="$(az group show -n "$RESOURCE_GROUP" --query id -o tsv)"
          suffix="$(printf '%s' "$resource_id" | sha256sum | cut -c1-20)"
          echo "POSTGRES_SERVER_NAME=pgnorium${suffix}" >> "$GITHUB_ENV"

      - name: Register the PostgreSQL resource provider
        shell: bash
        run: |
          az provider register --namespace Microsoft.DBforPostgreSQL --wait --output none
          state="$(az provider show --namespace Microsoft.DBforPostgreSQL --query registrationState -o tsv)"
          test "$state" = Registered

      - name: Provision managed PostgreSQL with 35-day backups
        shell: bash
        run: |
          az deployment group create -g "$RESOURCE_GROUP" -n norium-postgresql \
            --template-file infra/azure/postgresql.bicep \
            --parameters serverName="$POSTGRES_SERVER_NAME" administratorLogin="$POSTGRES_ADMIN_LOGIN" \
              administratorPassword="$POSTGRES_ADMIN_PASSWORD" databaseName="$POSTGRES_DATABASE" \
            --output none
          host="$(az postgres flexible-server show -g "$RESOURCE_GROUP" -n "$POSTGRES_SERVER_NAME" --query fullyQualifiedDomainName -o tsv)"
          test -n "$host"
          echo "POSTGRES_HOST=$host" >> "$GITHUB_ENV"

      - name: Allow only this runner during import
        shell: bash
        run: |
          runner_ip="$(curl --fail --silent --show-error --max-time 20 https://api.ipify.org)"
          [[ "$runner_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          az postgres flexible-server firewall-rule create -g "$RESOURCE_GROUP" --server-name "$POSTGRES_SERVER_NAME" \
            --name "github-${GITHUB_RUN_ID}" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" --output none

      - name: Install migration dependencies
        run: pip install -r norium-back-end/requirements.lock.txt azure-storage-file-share==12.23.1

      - name: Create the application database role
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            python infra/azure/prepare_postgres.py && exit 0
            sleep 15
          done
          exit 1

      - name: Record and stop the only production revision
        shell: bash
        run: |
          revision="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query properties.latestReadyRevisionName -o tsv)"
          test -n "$revision"
          echo "PREVIOUS_REVISION=$revision" >> "$GITHUB_ENV"
          az containerapp revision deactivate -g "$RESOURCE_GROUP" --revision "$revision" --output none
          for attempt in $(seq 1 30); do
            replicas="$(az containerapp replica list -g "$RESOURCE_GROUP" -n "$APP_NAME" --revision "$revision" --query 'length(@)' -o tsv 2>/dev/null || echo 0)"
            [[ "$replicas" = "0" ]] && exit 0
            sleep 2
          done
          echo 'Production writer did not stop.' >&2
          exit 1

      - name: Snapshot the quiesced source and migrate every operational record
        env:
          NORIUM_DATABASE_SSLMODE: verify-full
          NORA_BRAIN_DB_SSLMODE: verify-full
          PYTHONPATH: norium-back-end
        shell: bash
        run: |
          mkdir -p "$MIGRATION_SOURCE"
          python infra/azure/download_quiesced_data.py
          python infra/azure/migrate_to_postgres.py "$MIGRATION_SOURCE" --migration-id "azure-files-${GITHUB_RUN_ID}"

      - name: Permit Azure runtime access with database authentication enforced
        shell: bash
        run: |
          az postgres flexible-server firewall-rule create -g "$RESOURCE_GROUP" --server-name "$POSTGRES_SERVER_NAME" \
            --name norium-container-apps --start-ip-address 0.0.0.0 --end-ip-address 0.0.0.0 --output none

      - name: Activate PostgreSQL-backed production revision
        shell: bash
        run: |
          az containerapp secret set -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --secrets "norium-database-url=$NORIUM_DATABASE_URL" --output none
          az containerapp update -g "$RESOURCE_GROUP" -n "$APP_NAME" --min-replicas 1 --max-replicas 1 \
            --set-env-vars NORIUM_DATABASE_URL=secretref:norium-database-url NORIUM_POSTGRES_REQUIRED=1 \
              NORIUM_DATABASE_SSLMODE=verify-full NORA_BRAIN_DATABASE_URL=secretref:norium-database-url \
              NORA_BRAIN_DB_SSLMODE=verify-full --output none

      - name: Verify PostgreSQL readiness and authenticated business modules
        env:
          NORIUM_SMOKE_EMAIL: ${{ secrets.NORIUM_SMOKE_EMAIL }}
          NORIUM_SMOKE_PASSWORD: ${{ secrets.NORIUM_SMOKE_PASSWORD }}
        shell: bash
        run: |
          curl --fail --retry 24 --retry-delay 10 --retry-all-errors "$AZURE_PUBLIC_URL/health/ready"
          python infra/azure/postgres_cutover_smoke.py
          database_ref="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --query "properties.template.containers[0].env[?name=='NORIUM_DATABASE_URL'].secretRef | [0]" -o tsv)"
          required="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
            --query "properties.template.containers[0].env[?name=='NORIUM_POSTGRES_REQUIRED'].value | [0]" -o tsv)"
          test "$database_ref" = norium-database-url
          test "$required" = 1

      - name: Remove temporary runner database access
        shell: bash
        run: az postgres flexible-server firewall-rule delete -g "$RESOURCE_GROUP" --server-name "$POSTGRES_SERVER_NAME" --name "github-${GITHUB_RUN_ID}" --yes --output none

      - name: Mark the cutover as verified
        id: cutover
        shell: bash
        run: |
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Remove non-authoritative JSON and SQLite from the live share
        env:
          PYTHONPATH: infra/azure
        run: python infra/azure/cleanup_legacy_data.py

      - name: Restore the previous Azure Files revision if cutover did not verify
        if: ${{ failure() && steps.cutover.outputs.verified != 'true' }}
        shell: bash
        run: |
          if [[ -n "${PREVIOUS_REVISION:-}" ]]; then
            active_revision="$(az containerapp revision list -g "$RESOURCE_GROUP" -n "$APP_NAME" \
              --query '[?properties.active].name | [0]' -o tsv)"
            if [[ -n "$active_revision" && "$active_revision" != "$PREVIOUS_REVISION" ]]; then
              az containerapp revision deactivate -g "$RESOURCE_GROUP" --revision "$active_revision" --output none
            fi
            az containerapp revision activate -g "$RESOURCE_GROUP" --revision "$PREVIOUS_REVISION" --output none
            curl --fail --retry 24 --retry-delay 10 --retry-all-errors "$AZURE_PUBLIC_URL/health/ready"
            previous_active="$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$APP_NAME" \
              --revision "$PREVIOUS_REVISION" --query properties.active -o tsv)"
            test "${previous_active,,}" = true
            active_count="$(az containerapp revision list -g "$RESOURCE_GROUP" -n "$APP_NAME" \
              --query 'length([?properties.active])' -o tsv)"
            test "$active_count" = 1
          fi
          az postgres flexible-server firewall-rule delete -g "$RESOURCE_GROUP" --server-name "$POSTGRES_SERVER_NAME" \
            --name norium-container-apps --yes --output none 2>/dev/null || true

      - name: Remove temporary runner access after failure
        if: ${{ always() }}
        shell: bash
        run: az postgres flexible-server firewall-rule delete -g "$RESOURCE_GROUP" --server-name "$POSTGRES_SERVER_NAME" --name "github-${GITHUB_RUN_ID}" --yes --output none 2>/dev/null || true
