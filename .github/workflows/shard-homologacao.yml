name: Shard Cloud - validacao e pacote

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Serializa a validação e o pacote da mesma referência revisada.
concurrency:
  group: shard-homologacao-${{ github.ref }}
  cancel-in-progress: false


jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: norium-back-end/requirements.lock.txt

      - name: Install backend dependencies
        working-directory: norium-back-end
        run: |
          pip install -r requirements.lock.txt
          pip install bandit pip-audit

      - name: Validate backend
        working-directory: norium-back-end
        env:
          ENVIRONMENT: test
          APP_ENV: test
          NORIUM_DATA_DIR: ${{ runner.temp }}/norium-test-data
          PYTHON_DOTENV_DISABLED: "1"
          NORIUM_AI_COSTS_SQLITE_VFS: unix-dotfile
        run: |
          python -m compileall app main.py
          python ../scripts/run_backend_audit_tests.py --label ci-backend
          python -m pip check

      - name: Validate release workflow and deterministic Shard packaging
        run: python -m unittest scripts.test_release_workflow scripts.test_shard_release_package -v

      - name: Scan backend dependencies and source
        working-directory: norium-back-end
        run: |
          pip-audit -r requirements.lock.txt -f cyclonedx-json -o ../output/backend-sbom.cdx.json
          bandit -q -r app -x tests -ll

      - name: Preserve revision-bound backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: norium-front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: norium-front-end
        run: npm ci

      - name: Validate frontend
        working-directory: norium-front-end
        run: |
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate

      - name: Scan repository for committed secrets
        # Scanner failures (including service/licensing failures) block release.
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3

      - name: Prove secret scanner detects a synthetic canary
        run: |
          python scripts/check_secret_scanner.py --gitleaks /tmp/gitleaks-8.24.3/gitleaks
          /tmp/gitleaks-8.24.3/gitleaks git . --config .gitleaks.toml --log-opts=HEAD --redact=100 --no-banner --no-color --report-format=sarif --report-path output/gitleaks-history.sarif

      - name: Preserve redacted candidate history scan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-history-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/gitleaks-history.sarif
          if-no-files-found: error
          retention-days: 90

      - name: Check production frontend for permanent call secrets and test harnesses
        run: python norium-back-end/scripts/team_call_frontend_security.py norium-front-end


  postgres-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: norium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d norium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: test
      APP_ENV: test
      NORIUM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/norium
      NORIUM_DATABASE_SSLMODE: disable
      NORA_BRAIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/norium
      NORA_BRAIN_DB_SSLMODE: disable
      NORIUM_DATA_DIR: /tmp/norium-postgres-test-data
      PYTHONPATH: norium-back-end
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: norium-back-end/requirements.lock.txt
      - name: Install backend dependencies
        run: pip install -r norium-back-end/requirements.lock.txt
      - name: Prove JSONB, BYTEA, typed tables and idempotent import
        run: python infra/azure/test_postgres_persistence.py

  team-call-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      CI: "true"
      ENVIRONMENT: test
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: norium-back-end/requirements.lock.txt

      - name: Install backend and browser-test dependencies
        working-directory: norium-back-end
        run: pip install -r requirements.lock.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: norium-front-end/package-lock.json

      - name: Install frontend and TURN-test dependencies
        working-directory: norium-front-end
        run: npm ci

      - name: Install isolated Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Exercise real browser media, signaling, and load gates three times
        shell: bash
        run: |
          set +e
          python norium-front-end/tests/browser/team_call_e2e.py \
            --repeat 3 \
            --artifacts-dir output/team-call-quality/browser
          browser_status=$?
          python norium-back-end/tests/team_call_load.py \
            --repeat 3 \
            --artifacts-dir output/team-call-quality/load
          load_status=$?
          if [[ "${browser_status}" -ne 0 || "${load_status}" -ne 0 ]]; then
            echo "Team-call quality gate failed (browser=${browser_status}, load=${load_status})." >&2
            exit 1
          fi

      - name: Preserve aggregate team-call quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: team-call-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/team-call-quality/**
          if-no-files-found: ignore
          retention-days: 5

  shard-image-security:
    # Prova de build/runtime Shard sem publicar nem promover. Obriga sandbox
    # antes de qualquer publicação feita por este workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build exact Shard candidate with mandatory browser sandbox
        run: docker build --file Dockerfile.shard --build-arg "NORIUM_RELEASE_SHA=$(git rev-parse HEAD)" --tag norium-shard-security-ci .
      - name: Verify unprivileged image identity and real sandboxed DOM
        run: |
          test "$(docker image inspect norium-shard-security-ci --format '{{.Config.User}}')" = norium
          python infra/security/build_browser_seccomp.py "$RUNNER_TEMP/norium-browser-seccomp.json"
          docker run --rm --init --network none --cap-drop=ALL --security-opt no-new-privileges \
            --security-opt "seccomp=$RUNNER_TEMP/norium-browser-seccomp.json" --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /home/norium:rw,nosuid,nodev,uid=10001,gid=10001,size=128m \
            --entrypoint python norium-shard-security-ci -m app.infrastructure.browser_runtime_smoke --require-container-security
          echo 'shard_image_security_ci_passed: unprivileged image; sandbox required; DOM interaction'

      - name: Audit exact image packages and browser inventory
        id: image_audit
        env:
          TRIVY_VERSION: '0.75.0'
          TRIVY_ARCHIVE_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          evidence="$RUNNER_TEMP/shard-image-audit"
          mkdir -p "$evidence" "$RUNNER_TEMP/trivy-bin" "$RUNNER_TEMP/trivy-cache"
          curl --fail --show-error --location \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' "$TRIVY_ARCHIVE_SHA256" "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/trivy.tar.gz" --directory "$RUNNER_TEMP/trivy-bin" trivy
          "$RUNNER_TEMP/trivy-bin/trivy" --version > "$evidence/trivy-version.txt"
          export NORIUM_AUDIT_IMAGE_ID="$(docker image inspect norium-shard-security-ci --format '{{.Id}}')"
          export NORIUM_AUDIT_COMMIT_SHA="$(git rev-parse HEAD)"
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "shard-image-audit"
          commit = os.environ["NORIUM_AUDIT_COMMIT_SHA"]
          image_id = os.environ["NORIUM_AUDIT_IMAGE_ID"]
          if not re.fullmatch(r"[0-9a-f]{40}", commit) or not re.fullmatch(r"sha256:[0-9a-f]{64}", image_id):
              raise SystemExit("Invalid exact image/revision identifier")
          image = json.loads(subprocess.check_output(["docker", "image", "inspect", image_id]))[0]
          if image["Id"] != image_id or "NORIUM_RELEASE_SHA=" + commit not in image["Config"]["Env"]:
              raise SystemExit("Image is not bound to the checked out commit")
          provenance = {
              "commitSha": commit,
              "treeSha": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "dockerImageId": image_id,
              "imageIdKind": "local Docker image identifier; not a hosting registry digest",
              "hostingRegistryDigest": None,
              "repoDigestsObserved": image.get("RepoDigests") or [],
              "imageBytes": image["Size"], "os": image["Os"], "architecture": image["Architecture"],
              "runtimeUser": image["Config"]["User"],
              "sourceDockerfileSha256": hashlib.sha256(pathlib.Path("Dockerfile.shard").read_bytes()).hexdigest(),
              "scannerVersion": os.environ["TRIVY_VERSION"],
              "scannerArchiveSha256": os.environ["TRIVY_ARCHIVE_SHA256"],
              "scope": "Detected installed OS/language packages; vendored Chromium requires separate vendor advisory review",
              "publicationValidation": "This local CI image does not prove the digest of a later Shard rebuild",
          }
          (output / "image-provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
          PY
          docker run --rm --init -i --network none --cap-drop=ALL --security-opt no-new-privileges \
            --security-opt "seccomp=$RUNNER_TEMP/norium-browser-seccomp.json" --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /home/norium:rw,nosuid,nodev,uid=10001,gid=10001,size=128m \
            --entrypoint python "$NORIUM_AUDIT_IMAGE_ID" - > "$evidence/chromium-inventory.json" <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          from app.infrastructure.browser_runtime_smoke import browser_inventory
          with sync_playwright() as runtime:
              inventory = browser_inventory(runtime.chromium)
          if inventory["browserChannel"] != "chrome":
              raise SystemExit("The Shard image must use the pinned Google Chrome release")
          print(json.dumps(inventory, indent=2))
          PY
          : > "$evidence/empty-trivyignore"
          scanner="$RUNNER_TEMP/trivy-bin/trivy"
          "$scanner" --config= --cache-dir "$RUNNER_TEMP/trivy-cache" --timeout 15m image \
            --disable-telemetry --offline-scan --image-src docker --scanners vuln --pkg-types os,library \
            --ignorefile "$evidence/empty-trivyignore" --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 --format json --output "$evidence/image-vulnerabilities.json" "$NORIUM_AUDIT_IMAGE_ID"
          "$scanner" --config= --cache-dir "$RUNNER_TEMP/trivy-cache" --timeout 15m image \
            --disable-telemetry --offline-scan --skip-db-update --image-src docker --scanners vuln --pkg-types os,library \
            --ignorefile "$evidence/empty-trivyignore" --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --exit-code 0 --format cyclonedx --output "$evidence/image-sbom.cdx.json" "$NORIUM_AUDIT_IMAGE_ID"
          cp "$RUNNER_TEMP/trivy-cache/db/metadata.json" "$evidence/trivy-db-metadata.json"
          "$scanner" --config= --cache-dir "$RUNNER_TEMP/trivy-cache" --timeout 15m image \
            --disable-telemetry --offline-scan --skip-db-update --image-src docker --scanners vuln --pkg-types os,library \
            --ignorefile "$evidence/empty-trivyignore" --severity HIGH,CRITICAL --exit-code 1 --exit-on-eol 1 \
            --format json --output "$evidence/image-vulnerability-gate.json" "$NORIUM_AUDIT_IMAGE_ID"

      - name: Bind image audit reports to exact image and revision
        if: always()
        env:
          AUDIT_STEP_OUTCOME: ${{ steps.image_audit.outcome }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "shard-image-audit"
          output.mkdir(exist_ok=True)
          expected = ["image-provenance.json", "chromium-inventory.json", "image-vulnerabilities.json",
                      "image-sbom.cdx.json", "image-vulnerability-gate.json", "trivy-db-metadata.json", "trivy-version.txt"]
          provenance_file = output / "image-provenance.json"
          provenance = json.loads(provenance_file.read_text()) if provenance_file.exists() else {}
          files = [{"path": name, "sha256": hashlib.sha256((output / name).read_bytes()).hexdigest()}
                   for name in expected if (output / name).is_file()]
          missing = [name for name in expected if not (output / name).is_file()]
          receipt = {"commitSha": provenance.get("commitSha"), "dockerImageId": provenance.get("dockerImageId"),
                     "hostingRegistryDigest": None, "reports": files, "missingReports": missing,
                     "auditStepOutcome": os.environ["AUDIT_STEP_OUTCOME"],
                     "vulnerabilityGatePassed": os.environ["AUDIT_STEP_OUTCOME"] == "success",
                     "complete": not missing, "scope": provenance.get("scope"),
                     "publicationValidation": provenance.get("publicationValidation")}
          (output / "image-audit-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY

      - name: Preserve image SBOM vulnerability reports and browser inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shard-image-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/shard-image-audit/*
          if-no-files-found: error
          retention-days: 90

  shard-source-artifact:
    needs: [validate, postgres-persistence, team-call-quality, shard-image-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Package reviewed source without contacting the hosting provider
        run: python scripts/build_shard_release.py --repo . --commit "$(git rev-parse HEAD)" --output-dir output/shard-release
      - name: Preserve source ZIP and integrity receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shard-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/shard-release/*
          if-no-files-found: error
          retention-days: 90
