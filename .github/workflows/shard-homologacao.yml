name: Shard Cloud - validacao e pacote

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Serializa a validação e o pacote da mesma referência revisada.
concurrency:
  group: shard-homologacao-${{ github.ref }}
  cancel-in-progress: false


jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: norium-back-end/requirements.lock.txt

      - name: Install backend dependencies
        working-directory: norium-back-end
        run: |
          pip install -r requirements.lock.txt
          pip install bandit pip-audit

      - name: Validate backend
        working-directory: norium-back-end
        env:
          ENVIRONMENT: test
          APP_ENV: test
          NORIUM_DATA_DIR: ${{ runner.temp }}/norium-test-data
          PYTHON_DOTENV_DISABLED: "1"
          NORIUM_AI_COSTS_SQLITE_VFS: unix-dotfile
        run: |
          python -m compileall app main.py
          python ../scripts/run_backend_audit_tests.py --label ci-backend
          python -m pip check

      - name: Validate release workflow and deterministic Shard packaging
        run: python -m unittest scripts.test_release_workflow scripts.test_shard_release_package -v

      - name: Scan backend dependencies and source
        working-directory: norium-back-end
        run: |
          pip-audit -r requirements.lock.txt -f cyclonedx-json -o ../output/backend-sbom.cdx.json
          bandit -q -r app -x tests -ll

      - name: Preserve revision-bound backend SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-sbom-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/backend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: norium-front-end/package-lock.json

      - name: Install frontend dependencies
        working-directory: norium-front-end
        run: npm ci

      - name: Validate frontend
        working-directory: norium-front-end
        run: |
          npm run lint
          npm test
          npm run build
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate

      - name: Scan repository for committed secrets
        # Scanner failures (including service/licensing failures) block release.
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3

      - name: Prove secret scanner detects a synthetic canary
        run: |
          python scripts/check_secret_scanner.py --gitleaks /tmp/gitleaks-8.24.3/gitleaks
          /tmp/gitleaks-8.24.3/gitleaks git . --config .gitleaks.toml --log-opts=HEAD --redact=100 --no-banner --no-color --report-format=sarif --report-path output/gitleaks-history.sarif

      - name: Preserve redacted candidate history scan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-history-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/gitleaks-history.sarif
          if-no-files-found: error
          retention-days: 90

      - name: Check production frontend for permanent call secrets and test harnesses
        run: python norium-back-end/scripts/team_call_frontend_security.py norium-front-end


  postgres-persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: norium
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d norium"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ENVIRONMENT: test
      APP_ENV: test
      NORIUM_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/norium
      NORIUM_DATABASE_SSLMODE: disable
      NORA_BRAIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/norium
      NORA_BRAIN_DB_SSLMODE: disable
      NORIUM_DATA_DIR: /tmp/norium-postgres-test-data
      PYTHONPATH: norium-back-end
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: norium-back-end/requirements.lock.txt
      - name: Install backend dependencies
        run: pip install -r norium-back-end/requirements.lock.txt
      - name: Prove JSONB, BYTEA, typed tables and idempotent import
        run: python infra/azure/test_postgres_persistence.py

  team-call-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: test
      CI: "true"
      ENVIRONMENT: test
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: norium-back-end/requirements.lock.txt

      - name: Install backend and browser-test dependencies
        working-directory: norium-back-end
        run: pip install -r requirements.lock.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: norium-front-end/package-lock.json

      - name: Install frontend and TURN-test dependencies
        working-directory: norium-front-end
        run: npm ci

      - name: Install isolated Chromium runtime
        run: python -m playwright install --with-deps chromium

      - name: Exercise real browser media, signaling, and load gates three times
        shell: bash
        run: |
          set +e
          python norium-front-end/tests/browser/team_call_e2e.py \
            --repeat 3 \
            --artifacts-dir output/team-call-quality/browser
          browser_status=$?
          python norium-back-end/tests/team_call_load.py \
            --repeat 3 \
            --artifacts-dir output/team-call-quality/load
          load_status=$?
          if [[ "${browser_status}" -ne 0 || "${load_status}" -ne 0 ]]; then
            echo "Team-call quality gate failed (browser=${browser_status}, load=${load_status})." >&2
            exit 1
          fi

      - name: Preserve aggregate team-call quality evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: team-call-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/team-call-quality/**
          if-no-files-found: ignore
          retention-days: 5

  shard-image-security:
    # Prova de build/runtime Shard sem publicar nem promover. Obriga sandbox
    # antes de qualquer publicação feita por este workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build exact Shard candidate with mandatory browser sandbox
        run: docker build --file Dockerfile.shard --build-arg "NORIUM_RELEASE_SHA=$(git rev-parse HEAD)" --tag norium-shard-security-ci .
      - name: Verify unprivileged image identity and real sandboxed DOM
        run: |
          test "$(docker image inspect norium-shard-security-ci --format '{{.Config.User}}')" = norium
          python infra/security/build_browser_seccomp.py "$RUNNER_TEMP/norium-browser-seccomp.json"
          docker run --rm --init --network none --cap-drop=ALL --security-opt no-new-privileges \
            --security-opt "seccomp=$RUNNER_TEMP/norium-browser-seccomp.json" --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --tmpfs /home/norium:rw,nosuid,nodev,uid=10001,gid=10001,size=128m \
            --entrypoint python norium-shard-security-ci -m app.infrastructure.browser_runtime_smoke --require-container-security
          echo 'shard_image_security_ci_passed: unprivileged image; sandbox required; DOM interaction'

  shard-source-artifact:
    needs: [validate, postgres-persistence, team-call-quality, shard-image-security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Package reviewed source without contacting the hosting provider
        run: python scripts/build_shard_release.py --repo . --commit "$(git rev-parse HEAD)" --output-dir output/shard-release
      - name: Preserve source ZIP and integrity receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shard-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: output/shard-release/*
          if-no-files-found: error
          retention-days: 90
