name: Team call crash diagnostic
on:
  push:
    branches: [codex/team-call-linux-crash]
permissions:
  contents: read
jobs:
  crash:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: norium-back-end/requirements.txt
      - run: pip install -r norium-back-end/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: norium-front-end/package-lock.json
      - run: npm ci --prefix norium-front-end
      - run: python -m playwright install --with-deps chromium
      - run: python norium-front-end/tests/browser/team_call_crash_diagnostic.py
      - if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crash-diagnostic
          path: output/crash-diagnostic/**
          retention-days: 5
