name: Team call email channel probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      ALERT_EMAIL: ${{ vars.TEAM_CALL_ALERT_EMAIL }}
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Send one explicit test through the existing application email service
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, shlex, subprocess
          recipient = os.environ['ALERT_EMAIL']
          if not re.fullmatch(r'[A-Za-z0-9_.+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', recipient):
              raise SystemExit('Valid alert recipient required')
          revision = subprocess.check_output(['az', 'containerapp', 'show', '--resource-group', os.environ['RESOURCE_GROUP'],
              '--name', os.environ['APP_NAME'], '--query', 'properties.latestReadyRevisionName', '--output', 'tsv'], text=True).strip()
          remote = 'python -m app.infrastructure.team_call_alert_probe --recipient ' + recipient + ' --probe-id github-' + os.environ['GITHUB_RUN_ID']
          command = ['az', 'containerapp', 'exec', '--resource-group', os.environ['RESOURCE_GROUP'], '--name', os.environ['APP_NAME'],
                     '--revision', revision, '--command', remote]
          result = subprocess.run(['script', '-q', '-e', '-c', shlex.join(command), '/dev/null'],
                                  capture_output=True, text=True, timeout=120)
          matches = re.findall(r'TEAM_CALL_EMAIL_PROBE=(\{[^\r\n]*\})', result.stdout)
          report = json.loads(matches[-1]) if matches else {'smtpAccepted': False, 'errorType': 'remote_probe_result_missing'}
          print(json.dumps(report))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Email channel probe: ' + json.dumps(report) + '\n')
          raise SystemExit(0 if report.get('smtpAccepted') is True else 1)
          PY
