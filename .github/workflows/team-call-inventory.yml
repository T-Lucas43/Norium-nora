name: Team call OAuth configuration diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OAUTH_PUBLIC_URL: ${{ vars.AZURE_PUBLIC_URL }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Classify the public Google OAuth rejection without retaining the response
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          from urllib.parse import urlsplit
          spec = importlib.util.spec_from_file_location('oauth', '.github/scripts/verify-google-oauth.py')
          oauth = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(oauth)
          report = []
          for client_name, client_id in oauth.CLIENTS.items():
              for callback_name, callback in oauth.CALLBACKS.items():
                  status, final_url, body = oauth.fetch_authorization_page(oauth.authorization_url(client_id, callback))
                  reasons = [code for code in ('redirect_uri_mismatch', 'invalid_client', 'deleted_client', 'access_denied') if code in body.casefold()]
                  parsed = urlsplit(final_url)
                  report.append({'client': client_name, 'callback': callback_name, 'httpStatus': status,
                                 'reasons': reasons, 'googleHost': parsed.hostname == 'accounts.google.com',
                                 'errorPage': '/oauth/error' in parsed.path.casefold()})
          Path('output').mkdir(exist_ok=True)
          Path('output/oauth-status.json').write_text(json.dumps(report, indent=2))
          print('OAuth configuration status collected; no client IDs, response bodies or credentials retained.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oauth-configuration-status
          path: output/oauth-status.json
          retention-days: 5
