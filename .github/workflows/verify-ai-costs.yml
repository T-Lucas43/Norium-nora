name: Verify deployed AI costs
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Expected deployed release SHA
        required: true
        type: string
      restart:
        description: Restart the latest revision before verification
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restart the selected application revision
        if: ${{ inputs.restart }}
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
        run: |
          revision="$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP_NAME" --query properties.latestRevisionName -o tsv)"
          test -n "$revision"
          az containerapp revision restart -g "$RESOURCE_GROUP" -n "$APP_NAME" --revision "$revision" --output none
          sleep 30
      - name: Check authenticated accounting and persistence
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          EXPECTED_REVISION: ${{ inputs.revision }}
        run: |
          python -m pip install pexpect==4.9.0
          python infra/azure/verify_ai_costs.py
