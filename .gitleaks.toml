# These two files contain deterministic, public HMAC fixtures used only by
# unit tests. They are not credentials and are intentionally never loaded by
# the application runtime. Keep the paths narrow so real source/configuration
# secrets remain covered by the repository scan.

[allowlist]
description = "Synthetic HMAC test vectors"
paths = [
  '''norium-back-end/tests/unit/test_sfu_tokens\.py''',
  '''norium-back-end/tests/unit/test_turn_credentials\.py''',
]
