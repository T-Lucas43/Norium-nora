name: norium-evolution
# Serviço auxiliar privado. O Norium continua sendo publicado pelo fluxo GitHub.
# Criar .env com scripts/prepare_evolution_shard.py antes de iniciar.
services:
  evolution-database:
    image: ${EVOLUTION_POSTGRES_IMAGE:?Load the audited private database image first}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    environment:
      POSTGRES_USER: evolution
      POSTGRES_DB: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DATABASE_PASSWORD:?Missing database password}
    volumes:
      - evolution-database:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U evolution -d evolution']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  evolution-redis:
    image: ${EVOLUTION_REDIS_IMAGE:?Load the audited private cache image first}
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    command: [redis-server, --appendonly, 'yes', --maxmemory, 128mb, --maxmemory-policy, noeviction]
    networks: [data]
    volumes:
      - evolution-redis:/data
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  evolution-api:
    image: ${EVOLUTION_IMAGE:?Load the audited GitHub image and run the preparation script first}
    container_name: norium-evolution-api
    restart: unless-stopped
    init: true
    mem_limit: 1200m
    cpus: 1.5
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      data:
      edge:
        aliases: [evolution-api]
    depends_on:
      evolution-database: {condition: service_healthy}
      evolution-redis: {condition: service_started}
    environment:
      SERVER_TYPE: http
      SERVER_PORT: '8080'
      AUTHENTICATION_TYPE: apikey
      SERVER_URL: http://evolution-api:8080
      CONFIG_SESSION_PHONE_CLIENT: Norium
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: '30'
      QRCODE_COLOR: '#198754'
      CACHE_REDIS_TTL: '604800'
      WEBSOCKET_ENABLED: 'false'
      S3_ENABLED: 'false'
      CHATWOOT_ENABLED: 'false'
      SERVER_DISABLE_DOCS: 'true'
      SERVER_DISABLE_MANAGER: 'true'
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Missing API key}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: 'false'
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DATABASE_PASSWORD}@evolution-database:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: norium-shard-homologacao
      DATABASE_SAVE_DATA_INSTANCE: 'true'
      DATABASE_SAVE_DATA_NEW_MESSAGE: 'true'
      DATABASE_SAVE_MESSAGE_UPDATE: 'true'
      DATABASE_SAVE_DATA_CONTACTS: 'true'
      DATABASE_SAVE_DATA_CHATS: 'true'
      DATABASE_SAVE_DATA_HISTORIC: 'true'
      DATABASE_SAVE_DATA_LABELS: 'false'
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: norium-evolution
      CACHE_REDIS_SAVE_INSTANCES: 'true'
      CACHE_LOCAL_ENABLED: 'false'
      WEBHOOK_GLOBAL_ENABLED: 'false'
      TELEMETRY_ENABLED: 'false'
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
      CORS_ORIGIN: '*'
      DEL_INSTANCE: 'false'
      DEL_TEMP_INSTANCES: 'false'
      LANGUAGE: pt-BR
    volumes:
      - evolution-instances:/evolution/instances
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
networks:
  data:
    name: norium-evolution-data
    internal: true
  edge:
    external: true
    name: norium-edge
volumes:
  evolution-database:
  evolution-redis:
  evolution-instances:
