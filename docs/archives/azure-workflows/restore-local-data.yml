name: Restore local Norium data
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [inspect, apply]
        default: inspect
        required: true
      release_tag:
        type: string
        required: true
      sha256:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: azure-container-apps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}
      RESTORE_MODE: ${{ inputs.mode }}
      PAYLOAD_SHA256: ${{ inputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Download encrypted recovery package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release download "$RELEASE_TAG" --pattern payload.enc --repo "$GITHUB_REPOSITORY"
      - name: Install storage and encryption dependencies
        run: python -m pip install azure-storage-file-share==12.23.1 cryptography==46.0.5
      - name: Inspect or restore local records
        env:
          RESTORE_KEY: ${{ secrets.NORIUM_LOCAL_RESTORE_KEY }}
        run: python infra/azure/restore_local_data.py
      - name: Resume the original application revision
        if: always()
        run: |
          if [ -f resume-revision.txt ]; then
            az containerapp revision activate -g "$RESOURCE_GROUP" --revision "$(cat resume-revision.txt)" --output none
          fi
      - name: Verify public health after restoration
        if: success() && inputs.mode == 'apply'
        env:
          PUBLIC_URL: ${{ vars.AZURE_PUBLIC_URL }}
        run: curl --fail --silent --show-error --retry 18 --retry-delay 10 --retry-all-errors --max-time 25 "$PUBLIC_URL/health"
      - name: Preserve aggregate results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-recovery-report
          path: output/recovery-report.json
          if-no-files-found: ignore
          retention-days: 7
